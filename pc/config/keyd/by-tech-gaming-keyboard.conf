# AULA F75's primary keyboard and rotary-knob interfaces.
[ids]
258a:010c:3d952825
258a:010c:6aa8678d

[main]
# Exchange Caps Lock with left Control, and Super/Win with left Alt.
capslock = layer(control)
leftcontrol = capslock
leftalt = layer(meta)
leftmeta = layer(alt)

# In the F75's Office mode, knob rotation sends volume events.  Send its
# rotation to the display-brightness bindings instead.
volumeup = brightnessup
volumedown = brightnessdown
