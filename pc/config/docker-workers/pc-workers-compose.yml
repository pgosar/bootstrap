services:
  tdarr-node:
    container_name: tdarr-node-pc
    image: ghcr.io/haveagitgat/tdarr_node:latest@sha256:5493c345c3bfc13e107985ae702b0157897f3e1697bc1120af2798ba3f4d520a
    restart: unless-stopped
    ports:
      - "${PC_BIND_IP}:8268:8268"
    environment:
      - TZ=America/Los_Angeles
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - nodeName=pc-rtx5090
      - serverURL=http://${NAS_LAN_IP}:8266
      - apiKey=${TDARR_API_KEY}
      - nodeType=mapped
      - pathTranslators=[{"server":"/media","node":"/media"},{"server":"/torrents","node":"/torrents"},{"server":"/temp","node":"/temp"}]
      - transcodegpuWorkers=1
      - transcodecpuWorkers=2
      - healthcheckgpuWorkers=1
      - healthcheckcpuWorkers=1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /home/chilly/Server/media:/media
      - /home/chilly/Server/torrents:/torrents
      - /home/chilly/docker/appdata/tdarr-node/configs:/app/configs
      - /home/chilly/docker/appdata/tdarr-node/logs:/app/logs
      - /home/chilly/docker/appdata/tdarr-node/transcode-cache:/temp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  immich-machine-learning-pc:
    container_name: immich_machine_learning_pc
    image: ghcr.io/immich-app/immich-machine-learning:v3-cuda@sha256:63c5c212cce8ca78621c6d41a62c22e6c305d497cbb7a6069837d8cc7c2fd074
    restart: unless-stopped
    ports:
      - "${PC_BIND_IP}:3003:3003"
    environment:
      MACHINE_LEARNING_HOST: "0.0.0.0"
    volumes:
      - /home/chilly/docker/appdata/immich-machine-learning/model-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
